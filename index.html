<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#1C1C1E"/>
<meta name="description" content="Fusain : un atelier de dessin tactile, à la trame, pour la bande dessinée."/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Fusain"/>
<title>Fusain</title>
<link rel="icon" href="favicon.ico" sizes="any"/>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&family=DM+Mono:wght@400;500&family=Bangers&family=Comic+Neue:wght@400;700&family=Patrick+Hand&family=Patrick+Hand+SC&family=Caveat:wght@500;700&family=Gloria+Hallelujah&family=Kalam:wght@400;700&family=Permanent+Marker&family=Special+Elite&family=Amatic+SC:wght@400;700&family=Shadows+Into+Light&family=Indie+Flower&family=Architects+Daughter&family=Londrina+Solid:wght@400;900&family=Luckiest+Guy&family=Schoolbell&family=Short+Stack&family=Gochi+Hand&family=Rock+Salt&family=Covered+By+Your+Grace&family=Reenie+Beanie&family=Nanum+Pen+Script&family=Coming+Soon&family=Boogaloo&family=Chewy&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.1/dist/tabler-icons.min.css"/>
<link rel="stylesheet" href="css/style.css"/>
<link rel="stylesheet" href="css/mobile.css"/>
</head>
<body>
<div id="boot" class="boot" role="status" aria-live="polite">
  <div class="boot-card">
    <img src="favicon.svg" alt="" width="56" height="56"/>
    <div class="boot-name">Fusain</div>
    <div class="boot-bar" aria-hidden="true"><span></span></div>
    <p id="boot-msg" class="boot-msg">Chargement…</p>
    <button id="boot-retry" class="btn" type="button" hidden onclick="location.reload()">Recharger</button>
  </div>
</div>
<script>
  // Écran de chargement : il couvre tout jusqu'à ce que l'accueil soit prêt (main.js le retire), et dit l'échec s'il y en a un.
  (function () {
    var done = false;
    window.fusainBootFail = function (msg) {
      if (done) return; done = true;
      var b = document.getElementById('boot'); if (!b) return;
      b.classList.add('failed');
      document.getElementById('boot-msg').textContent = msg || 'Fusain n\'a pas pu se charger. Vérifie la connexion, puis recharge.';
      document.getElementById('boot-retry').hidden = false;
    };
    window.fusainBootDone = function () { done = true; clearTimeout(slow); var b = document.getElementById('boot'); if (b) b.remove(); };
    window.addEventListener('error', function (e) { if (!e.filename || /\/js\//.test(e.filename)) window.fusainBootFail(); });
    var slow = setTimeout(function () { window.fusainBootFail('Le chargement est anormalement long. Vérifie la connexion, puis recharge.'); }, 30000);
  })();
</script>
<header class="topbar safe-top">
  <a id="home" class="brand" href="./" aria-label="Fusain, retour à l'accueil">
    <span class="brand-mark"><img src="favicon.svg" alt="" width="28" height="28"/></span>
    <span class="brand-name">Fusain</span>
  </a>
  <nav id="menubar" class="menubar" aria-label="Menus" hidden></nav>
  <div id="crumb" class="crumb"></div>
  <div class="topbar-actions">
    <button id="settings" class="icon-btn icon-only" type="button" aria-label="Réglages" title="Réglages">
      <i class="ti ti-settings" aria-hidden="true"></i><span id="sync-dot" class="sync-dot" hidden></span>
    </button>
  </div>
</header>
<main id="app" style="flex:1;min-height:0;display:flex;flex-direction:column"></main>
<div id="modals"></div>
<div id="toasts" aria-live="polite"></div>
<noscript><p style="padding:24px">Fusain a besoin de JavaScript.</p></noscript>
<script type="module" src="js/main.js" onerror="fusainBootFail()"></script>
</body>
</html>
