<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#1C1C1E"/>
<meta name="description" content="Fusain : un atelier de dessin tactile, à la trame, pour la bande dessinée."/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Fusain"/>
<title>Fusain</title>
<link rel="icon" href="favicon.ico" sizes="any"/>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.1/dist/tabler-icons.min.css"/>
<link rel="stylesheet" href="css/style.css"/>
<link rel="stylesheet" href="css/mobile.css"/>
</head>
<body>
<header class="topbar safe-top">
  <a id="home" class="brand" href="./" aria-label="Fusain, retour à l'accueil">
    <span class="brand-mark"><img src="favicon.svg" alt="" width="28" height="28"/></span>
    <span class="brand-name">Fusain</span>
  </a>
  <div id="crumb" class="crumb"></div>
  <div class="topbar-actions">
    <button id="settings" class="icon-btn icon-only" type="button" aria-label="Réglages" title="Réglages">
      <i class="ti ti-settings" aria-hidden="true"></i><span id="sync-dot" class="sync-dot" hidden></span>
    </button>
  </div>
</header>
<main id="app" style="flex:1;min-height:0;display:flex;flex-direction:column"></main>
<div id="modals"></div>
<div id="toasts" aria-live="polite"></div>
<noscript><p style="padding:24px">Fusain a besoin de JavaScript.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
